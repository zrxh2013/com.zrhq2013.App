<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#003E7E">
<title>个税表单下载</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:#dfe6f0;
    display:flex; justify-content:center;
  }
  /* 移动端全屏；桌面端居中手机宽度容器 */
  .app {
    width:100%; max-width:480px; min-height:100vh;
    background:#F4F6FA;
    display:flex; flex-direction:column;
    position:relative;
    box-shadow:0 0 40px rgba(0,40,90,.12);
  }

  /* ===== 头部 ===== */
  .header {
    background:linear-gradient(135deg,#0B63B8,#003E7E);
    border-bottom-left-radius:20px;
    border-bottom-right-radius:20px;
    padding:calc(14px + env(safe-area-inset-top)) 20px 22px;
    flex-shrink:0;
  }
  /* 网址栏（固定主域名） */
  .url-bar {
    height:32px; background:#0F4F96; border-radius:16px;
    display:flex; align-items:center; gap:6px; padding:0 12px;
    margin-bottom:16px;
  }
  .url-bar .lock { width:13px; height:13px; fill:#8FE3B0; flex-shrink:0; }
  .url-bar .url {
    color:#EAF3FF; font-size:12px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
  }
  .header h1 { color:#fff; font-size:23px; font-weight:700; }
  .sub { color:#CFE3F7; font-size:13px; margin-top:6px; }
  .search {
    margin-top:16px; height:44px; background:#fff; border-radius:22px;
    display:flex; align-items:center; gap:8px; padding:0 14px;
  }
  .search svg { width:18px; height:18px; fill:#7A8699; flex-shrink:0; }
  .search input {
    border:none; outline:none; font-size:14px; color:#1F2733; width:100%;
    background:transparent;
  }

  /* ===== 分类 ===== */
  .tabs {
    display:flex; gap:10px; padding:14px 16px 4px; flex-shrink:0;
  }
  .chip {
    font-size:13px; padding:0 18px; height:34px; line-height:34px;
    border-radius:17px; cursor:pointer; user-select:none; text-align:center;
    transition:all .15s;
  }
  .chip.on { background:#005BAC; color:#fff; }
  .chip.off { background:#fff; color:#4A5568; border:1px solid #E2E8F0; }

  .sec { font-size:12px; color:#7A8699; padding:10px 20px 6px; }

  /* ===== 列表 ===== */
  .list {
    flex:1; padding:0 14px 16px;
  }
  .card {
    background:#fff; border-radius:14px; padding:14px;
    display:flex; align-items:center; gap:12px;
    box-shadow:0 2px 8px rgba(15,60,110,.06); margin-bottom:10px;
  }
  .ic {
    width:44px; height:44px; border-radius:12px; background:#E8F1FB; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .ic svg { width:22px; height:22px; fill:#005BAC; }
  .meta { flex:1; min-width:0; }
  .meta .n { font-size:14px; font-weight:600; color:#1F2733; line-height:1.4; }
  .meta .d { font-size:11px; color:#9AA6B5; margin-top:6px; white-space:nowrap; }
  .zip {
    display:inline-block; background:#FFF4E0; color:#C77B16; font-size:10px;
    border-radius:4px; padding:1px 5px; margin-right:6px;
  }
  .dl {
    flex-shrink:0; border:1px solid #9CC4EC; color:#005BAC; background:#F2F8FF;
    font-size:13px; border-radius:18px; padding:8px 14px;
    display:flex; align-items:center; gap:5px; cursor:pointer;
    text-decoration:none;
  }
  .dl:active { background:#E1EFFE; }
  .dl svg { width:14px; height:14px; fill:#005BAC; }

  .empty {
    display:none; flex-direction:column; align-items:center;
    padding:70px 0; color:#9AA6B5; font-size:13px;
  }
  .empty svg { width:64px; height:64px; fill:#C6D0DD; margin-bottom:12px; }

  /* ===== 底部 ===== */
  .footer {
    flex-shrink:0; text-align:center;
    padding:8px 16px calc(14px + env(safe-area-inset-bottom));
    background:#F4F6FA;
  }
  .btn-official {
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; height:46px; border-radius:23px;
    border:1px solid #9CC4EC; background:#fff; color:#005BAC;
    font-size:14px; cursor:pointer; text-decoration:none;
  }
  .btn-official:active { background:#F2F8FF; }
  .btn-official svg { width:18px; height:18px; fill:#005BAC; }
  .source { font-size:11px; color:#9AA6B5; margin-top:8px; }

  /* 桌面端提示 */
  @media (min-width:520px) {
    body { padding:24px 0; }
    .app { min-height:calc(100vh - 48px); border-radius:24px; overflow:hidden; }
  }
</style>
</head>
<body>
<div class="app">

  <header class="header">
    <div class="url-bar">
      <svg class="lock" viewBox="0 0 24 24"><path d="M18,8h-1V6c0,-2.76 -2.24,-5 -5,-5S7,3.24 7,6v2H6c-1.1,0 -2,0.9 -2,2v10c0,1.1 0.9,2 2,2h12c1.1,0 2,-0.9 2,-2V10c0,-1.1 -0.9,-2 -2,-2zM12,17c-1.1,0 -2,-0.9 -2,-2s0.9,-2 2,-2 2,0.9 2,2 -0.9,2 -2,2zM15.1,8H8.9V6c0,-1.71 1.39,-3.1 3.1,-3.1s3.1,1.39 3.1,3.1v2z"/></svg>
      <span class="url">https://etax.chinatax.gov.cn</span>
    </div>
    <h1>个税表单下载</h1>
    <div class="sub">自然人电子税务局 · 公众服务</div>
    <div class="search">
      <svg viewBox="0 0 24 24"><path d="M15.5,14h-0.79l-0.28,-0.27C15.41,12.59 16,11.11 16,9.5 16,5.91 13.09,3 9.5,3S3,5.91 3,9.5 5.91,16 9.5,16c1.61,0 3.09,-0.59 4.23,-1.57l0.27,0.28v0.79l5,4.99L20.49,19l-4.99,-5zM9.5,14C7.01,14 5,11.99 5,9.5S7.01,5 9.5,5 14,7.01 14,9.5 11.99,14 9.5,14z"/></svg>
      <input id="kw" type="search" placeholder="搜索表单名称" autocomplete="off">
    </div>
  </header>

  <div class="tabs">
    <div class="chip on" id="tab-forms">业务表单</div>
    <div class="chip off" id="tab-tools">软件工具</div>
  </div>

  <div class="sec" id="section-title">信息采集管理</div>

  <div class="list" id="list"></div>

  <div class="empty" id="empty">
    <svg viewBox="0 0 24 24"><path d="M20,6h-4l-2,-2H9.17L8,6H4v12h16V6zM14.83,4l1,2H7.41l1,-2h6.42zM12,17c-2.76,0 -5,-2.24 -5,-5h2c0,1.66 1.34,3 3,3s3,-1.34 3,-3h2c0,2.76 -2.24,5 -5,5z"/></svg>
    <span id="empty-text">当前还没有可下载的内容</span>
  </div>

  <footer class="footer">
    <a class="btn-official" href="https://etax.chinatax.gov.cn/webstatic/download-service/100009" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M19,19H5V5h7V3H5c-1.11,0 -2,0.9 -2,2v14c0,1.1 0.89,2 2,2h14c1.1,0 2,-0.9 2,-2v-7h-2v7zM14,3v2h3.59l-9.83,9.83 1.41,1.41L19,6.41V10h2V3h-7z"/></svg>
      在官网查看完整下载服务
    </a>
    <div class="source">数据来源：自然人电子税务局官方网站</div>
  </footer>
</div>

<script>
  // 数据来自官网下载服务真实返回（wcdn.etax.chinatax.gov.cn）
  var FORMS = [
    {
      name: '个人所得税基础信息表（A表）',
      date: '2020-07-28', size: '24 KB',
      url: 'https://wcdn.etax.chinatax.gov.cn/bbxzdownload/collection/xxcjgl/grsdsjcxxa.zip'
    },
    {
      name: '个人所得税基础信息表（B表）',
      date: '2020-07-28', size: '25 KB',
      url: 'https://wcdn.etax.chinatax.gov.cn/bbxzdownload/collection/xxcjgl/grsdsjcxxb.zip'
    }
  ];
  var TOOLS = [];
  var tab = 0; // 0 业务表单 1 软件工具
  var kw = document.getElementById('kw');
  var listEl = document.getElementById('list');
  var emptyEl = document.getElementById('empty');
  var emptyText = document.getElementById('empty-text');
  var sectionTitle = document.getElementById('section-title');

  var FILE_ICON = '<svg viewBox="0 0 24 24"><path d="M14,2H6c-1.1,0 -1.99,0.9 -1.99,2L4,20c0,1.1 0.89,2 1.99,2H18c1.1,0 2,-0.9 2,-2V8l-6,-6zM16,18H8v-2h8v2zM16,14H8v-2h8v2zM13,9V3.5L18.5,9H13z"/></svg>';
  var DL_ICON = '<svg viewBox="0 0 24 24"><path d="M19,9h-4V3H9v6H5l7,7 7,-7zM5,18v2h14v-2H5z"/></svg>';

  function render() {
    var data = tab === 0 ? FORMS : TOOLS;
    var key = kw.value.trim();
    var shown = key ? data.filter(function (f) { return f.name.indexOf(key) > -1; }) : data;
    sectionTitle.textContent = tab === 0 ? '信息采集管理' : '软件工具';
    listEl.innerHTML = shown.map(function (f) {
      var file = f.url.slice(f.url.lastIndexOf('/') + 1);
      return '<div class="card">' +
        '<div class="ic">' + FILE_ICON + '</div>' +
        '<div class="meta">' +
          '<div class="n">' + f.name + '</div>' +
          '<div class="d"><span class="zip">ZIP</span>' + f.date + ' · ' + f.size + '</div>' +
        '</div>' +
        '<a class="dl" href="' + f.url + '" download="' + file + '" rel="noopener">' + DL_ICON + '下载</a>' +
      '</div>';
    }).join('');
    var noData = data.length === 0;
    emptyEl.style.display = shown.length === 0 ? 'flex' : 'none';
    emptyText.textContent = noData ? '当前还没有可下载的内容' : '未找到匹配的表单';
  }

  document.getElementById('tab-forms').addEventListener('click', function () { tab = 0; syncTabs(); render(); });
  document.getElementById('tab-tools').addEventListener('click', function () { tab = 1; syncTabs(); render(); });
  function syncTabs() {
    var a = document.getElementById('tab-forms'), b = document.getElementById('tab-tools');
    a.className = 'chip ' + (tab === 0 ? 'on' : 'off');
    b.className = 'chip ' + (tab === 1 ? 'on' : 'off');
  }
  kw.addEventListener('input', render);
  render();
</script>
</body>
</html>
