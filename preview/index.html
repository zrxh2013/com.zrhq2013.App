<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个税表单下载 - APP 预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #dfe6f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .phone {
    width: 390px;
    height: 820px;
    background: #F4F6FA;
    border-radius: 38px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0, 40, 90, .28);
    position: relative;
    display: flex;
    flex-direction: column;
    border: 10px solid #10151c;
  }
  .statusbar {
    height: 34px; background: #003E7E;
    color: #fff; font-size: 12px; font-weight: 600;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px; flex-shrink: 0;
  }
  .statusbar .dots { letter-spacing: 2px; }
  /* 头部 */
  .header {
    background: linear-gradient(135deg, #0B63B8, #003E7E);
    border-bottom-left-radius: 20px;
    border-bottom-right-radius: 20px;
    padding: 18px 20px 22px;
    flex-shrink: 0;
  }
  .header h1 { color: #fff; font-size: 23px; font-weight: 700; }
  .header .sub { color: #CFE3F7; font-size: 13px; margin-top: 6px; }
  .search {
    margin-top: 16px;
    height: 44px; background: #fff; border-radius: 22px;
    border: 1px solid #E7EBF2;
    display: flex; align-items: center; gap: 8px;
    padding: 0 14px;
  }
  .search svg { width: 18px; height: 18px; fill: #7A8699; flex-shrink: 0; }
  .search input {
    border: none; outline: none; flex: 1; height: 100%;
    font-size: 14px; color: #1F2733; background: transparent;
  }
  .search input::placeholder { color: #7A8699; }
  /* 分类 */
  .chips {
    display: flex; gap: 10px; padding: 14px 16px 4px;
    flex-shrink: 0;
  }
  .chip {
    height: 34px; line-height: 32px; padding: 0 18px;
    border-radius: 18px; font-size: 13px; cursor: pointer;
    border: 1px solid #E7EBF2; background: #fff; color: #24445F;
    user-select: none;
  }
  .chip.active { background: #005BAC; color: #fff; border-color: #005BAC; }
  .section-title {
    font-size: 12px; color: #7A8699;
    padding: 10px 20px 6px;
  }
  /* 列表 */
  .list { flex: 1; overflow-y: auto; padding: 0 16px; }
  .card {
    background: #fff; border-radius: 14px;
    border: 1px solid #E7EBF2;
    box-shadow: 0 2px 6px rgba(20, 50, 90, .05);
    display: flex; align-items: center;
    padding: 14px; margin-bottom: 10px;
  }
  .file-icon {
    width: 46px; height: 46px; border-radius: 50%;
    background: #E8F2FC; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .file-icon svg { width: 26px; height: 26px; fill: #005BAC; }
  .card-info { flex: 1; margin-left: 12px; min-width: 0; }
  .card-name {
    font-size: 15px; font-weight: 700; color: #1F2733;
    line-height: 1.35;
  }
  .card-meta { display: flex; align-items: center; gap: 8px; margin-top: 7px; }
  .zip-tag {
    background: #FFF4E0; color: #B07013; font-size: 10px;
    font-weight: 700; border-radius: 4px; padding: 2px 6px;
  }
  .card-date { font-size: 12px; color: #7A8699; }
  .btn-dl {
    flex-shrink: 0; margin-left: 10px;
    height: 38px; padding: 0 14px; border-radius: 19px;
    background: #EAF3FC; color: #005BAC;
    font-size: 13px; font-weight: 700; border: none;
    display: flex; align-items: center; gap: 5px; cursor: pointer;
  }
  .btn-dl svg { width: 18px; height: 18px; fill: #005BAC; }
  /* 底部 */
  .footer {
    flex-shrink: 0; padding: 8px 16px 14px;
    background: #F4F6FA;
  }
  .btn-official {
    width: 100%; height: 46px; border-radius: 12px;
    background: #fff; border: 1px solid #005BAC; color: #005BAC;
    font-size: 14px; display: flex; align-items: center; justify-content: center;
    gap: 8px; cursor: pointer;
  }
  .btn-official svg { width: 18px; height: 18px; fill: #005BAC; }
  .source { text-align: center; font-size: 11px; color: #9AA6B5; margin-top: 8px; }
  .tip {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    color: #5a6b80; font-size: 12px;
  }
</style>
</head>
<body>
  <div class="phone">
    <div class="statusbar"><span>9:41</span><span class="dots">●●● ▲ ▮</span></div>

    <div class="header">
      <h1>个税表单下载</h1>
      <div class="sub">自然人电子税务局 · 公众服务</div>
      <div class="search">
        <svg viewBox="0 0 24 24"><path d="M15.5,14h-0.79l-0.28,-0.27C15.41,12.59 16,11.11 16,9.5 16,5.91 13.09,3 9.5,3S3,5.91 3,9.5 5.91,16 9.5,16c1.61,0 3.09,-0.59 4.23,-1.57l0.27,0.28v0.79l5,4.99L20.49,19l-4.99,-5zM9.5,14C7.01,14 5,11.99 5,9.5S7.01,5 9.5,5 14,7.01 14,9.5 11.99,14 9.5,14z"/></svg>
        <input id="kw" placeholder="搜索表单名称" />
      </div>
    </div>

    <div class="chips">
      <div class="chip active" id="tab-forms" onclick="setTab(0)">业务表单</div>
      <div class="chip" id="tab-tools" onclick="setTab(1)">软件工具</div>
    </div>

    <div class="section-title" id="section-title">信息采集管理</div>

    <div class="list" id="list"></div>

    <div class="footer">
      <button class="btn-official">
        <svg viewBox="0 0 24 24"><path d="M19,19H5V5h7V3H5c-1.11,0 -2,0.9 -2,2v14c0,1.1 0.89,2 2,2h14c1.1,0 2,-0.9 2,-2v-7h-2v7zM14,3v2h3.59l-9.83,9.83 1.41,1.41L19,6.41V10h2V3h-7z"/></svg>
        在官网查看完整下载服务
      </button>
      <div class="source">数据来源：自然人电子税务局官方网站</div>
    </div>
  </div>

  <div class="tip">APP 首页视觉预览（390 × 820），交互可点击：搜索过滤 / 切换分类</div>

<script>
  const forms = [
    { name: '个人所得税基础信息表（A表）', date: '2020-07-28', size: '24 KB' },
    { name: '个人所得税基础信息表（B表）', date: '2020-07-28', size: '25 KB' }
  ];
  const list = document.getElementById('list');
  const title = document.getElementById('section-title');
  const kw = document.getElementById('kw');
  let tab = 0;

  const fileSvg = '<svg viewBox="0 0 24 24"><path d="M14,2H6C4.9,2 4,2.9 4,4v16c0,1.1 0.9,2 2,2h12c1.1,0 2,-0.9 2,-2V8L14,2zM16,18H8v-2h8V18zM16,14H8v-2h8V14zM13,9V3.5L18.5,9H13z"/></svg>';
  const dlSvg = '<svg viewBox="0 0 24 24"><path d="M19,9h-4V3H9v6H5l7,7 7,-7zM5,18v2h14v-2H5z"/></svg>';

  function render() {
    list.innerHTML = '';
    if (tab === 1) {
      title.textContent = '软件工具';
      list.innerHTML = '<div style="text-align:center;color:#7A8699;font-size:13px;padding:80px 0;">当前暂无可下载的软件工具</div>';
      return;
    }
    title.textContent = '信息采集管理';
    const key = kw.value.trim();
    const data = forms.filter(f => !key || f.name.includes(key));
    if (!data.length) {
      list.innerHTML = '<div style="text-align:center;color:#7A8699;font-size:13px;padding:80px 0;">未找到匹配的表单</div>';
      return;
    }
    data.forEach(f => {
      list.insertAdjacentHTML('beforeend', `
        <div class="card">
          <div class="file-icon">${fileSvg}</div>
          <div class="card-info">
            <div class="card-name">${f.name}</div>
            <div class="card-meta">
              <span class="zip-tag">ZIP</span>
              <span class="card-date">${f.date} · ${f.size}</span>
            </div>
          </div>
          <button class="btn-dl">${dlSvg}下载</button>
        </div>`);
    });
  }
  function setTab(t) {
    tab = t;
    document.getElementById('tab-forms').classList.toggle('active', t === 0);
    document.getElementById('tab-tools').classList.toggle('active', t === 1);
    render();
  }
  kw.addEventListener('input', render);
  render();
</script>
</body>
</html>
