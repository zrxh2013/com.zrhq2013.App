<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TRON 转账" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://api.trongrid.io https://nile.trongrid.io; manifest-src 'self'"
  />
  <title>TRON 转账工具</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <h1>TRON 转账</h1>
    </div>
    <div class="net">
      <select id="network" aria-label="网络">
        <option value="mainnet">主网</option>
        <option value="nile" selected>Nile 测试网</option>
      </select>
      <span id="netBadge" class="badge">未解锁</span>
    </div>
  </header>

  <main>
    <section class="card">
      <h2>钱包</h2>
      <div class="field">
        <label for="pk">私钥</label>
        <input id="pk" type="password" placeholder="64 位十六进制私钥" autocomplete="off" autocapitalize="off" spellcheck="false" />
        <p id="pkHint" class="hint">仅保存在页面内存，刷新即清除。</p>
      </div>
      <div class="row">
        <button id="btnUnlock" class="primary">解锁</button>
        <button id="btnLock" class="ghost" disabled>锁定</button>
        <button id="btnRefresh" class="ghost" disabled>刷新</button>
      </div>
      <div class="addr">
        <span class="label">当前地址</span>
        <code id="address">—</code>
      </div>
      <div class="balances">
        <div class="balance">
          <span>TRX</span>
          <strong id="trxBalance">—</strong>
        </div>
        <div class="balance">
          <span id="usdtLabel">USDT</span>
          <strong id="usdtBalance">—</strong>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>转账</h2>
      <div class="tabs" role="tablist">
        <button class="tab active" data-type="trx" role="tab">TRX</button>
        <button id="usdtTab" class="tab" data-type="usdt" role="tab">USDT</button>
      </div>
      <p id="usdtNotice" class="hint hidden">Nile 当前使用自定义测试 USDT（非官方 USDT）。</p>

      <div class="field">
        <label for="to">收款地址</label>
        <input id="to" type="text" placeholder="T 开头的 TRON 地址" autocomplete="off" autocapitalize="off" spellcheck="false" />
      </div>
      <div class="field">
        <label for="amount">金额</label>
        <input id="amount" type="number" inputmode="decimal" min="0" step="0.000001" placeholder="0.000000" />
      </div>
      <div class="field">
        <label for="memo">备注（写入链上 memo，公开可见）</label>
        <input id="memo" type="text" maxlength="300" placeholder="例如 订单号 INV-2026-0001" autocomplete="off" />
      </div>

      <div class="row">
        <button id="btnEstimate" class="ghost" disabled>预估费用</button>
        <button id="btnSend" class="primary" disabled>发送</button>
      </div>

      <div id="estimate" class="note hidden"></div>
      <div id="result" class="note success hidden"></div>
      <div id="error" class="note error hidden"></div>
    </section>

    <section class="card records">
      <div class="records-head">
        <h2>转账记录</h2>
        <button id="btnExport" class="ghost small">导出 CSV</button>
      </div>
      <ul id="recordsList" class="records-list">
        <li class="empty">暂无记录</li>
      </ul>
    </section>
  </main>

  <footer class="footer">
    <p>私钥即资产。本页面不保存私钥，也不会把私钥发送到任何服务器。</p>
  </footer>

  <script src="./vendor/buffer.global.js"></script>
  <script src="./vendor/tronweb.js"></script>
  <script src="./app.js"></script>
</body>
</html>
